<ion-list>
  <ion-item *ngFor="let disp of dispositivos">
    <ion-label>
      {{ disp.dispositivoId }} - {{ disp.nombre }} - {{ disp.ubicacion }} - {{ disp.electrovalvulaId }}
    </ion-label>
    <ion-button
      slot="end"
      fill="outline"
      size="small"
      (click)="verDetalle(disp); $event.stopPropagation()"
    >
      Ver detalle
    </ion-button>
  </ion-item>
</ion-list>
