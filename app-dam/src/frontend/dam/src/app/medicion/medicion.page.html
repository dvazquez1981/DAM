<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mediciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngIf="!mediciones || mediciones.length === 0">
      Cargando mediciones...
    </ion-item>

    <ion-item *ngFor="let medicion of mediciones">
      {{ medicion.fecha | date:'yyyy-MM-dd HH:mm:ss' }} - Valor: {{ medicion.valor }}
    </ion-item>
  </ion-list>
</ion-content>
